name: Publish the app

# builds the app and puts it on GitHub Pages: https://thorfinson.github.io/noise-floor/
# Only a commit on main whose checks passed is published: this runs when the "Checks" workflow has finished
# for a push to main, and builds exactly the commit those checks ran on. By hand (workflow_dispatch) it
# publishes the branch it is started on.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# one publication at a time; a running one is never cancelled half-way (a newer one waits for it)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # the checks of a push to main in this repository, and only when they passed (a pull request from a fork
    # can come from a branch called main too: its runs are not pushes)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's settings
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only this job may publish: the build (which runs the install scripts of the dependencies) cannot
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
